<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>From Workhouse to Standing Ovation</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000;
        --ink: #f2efe6;
        --plate: rgba(8, 8, 8, 0.82);
        --font-display: "EB Garamond", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: var(--font-display); }
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: 0.28; image-rendering: pixelated; }
      #flicker { position: absolute; inset: 0; background: #000; opacity: 0; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.78) 100%); }
      #fade { position: absolute; inset: 0; background: #7a7a7a; opacity: 0; }
      .card {
        position: absolute; left: 90px; right: 90px; top: 170px;
        padding: 46px 40px; text-align: center; color: var(--ink);
        background: var(--plate);
        border: 3px solid rgba(242, 239, 230, 0.85);
        outline: 1px solid rgba(242, 239, 230, 0.55); outline-offset: -14px;
        font-size: 66px; line-height: 1.18; font-weight: 700; letter-spacing: 0.01em;
        opacity: 0;
      }
      .card::before, .card::after {
        content: "\2756"; position: absolute; left: 50%; transform: translateX(-50%);
        font-size: 30px; color: rgba(242, 239, 230, 0.9); background: #0b0b0b; padding: 0 14px;
      }
      .card::before { top: -20px; }
      .card::after { bottom: -20px; }
      #end {
        position: absolute; left: 0; right: 0; top: 860px; text-align: center;
        color: var(--ink); font-size: 120px; font-style: italic; font-weight: 700; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <div id="stage">
        <canvas id="gl" width="1080" height="1920"></canvas>
        <div id="fade"></div>
        <div id="vignette"></div>
        <canvas id="grain" width="270" height="480"></canvas>
        <div id="flicker"></div>
        <div id="c1" class="card clip" data-start="0" data-duration="5" data-track-index="1">London, 1896.</div>
        <div id="c2" class="card clip" data-start="5" data-duration="7" data-track-index="1">Age seven.<br />The workhouse.</div>
        <div id="c3" class="card clip" data-start="12" data-duration="7" data-track-index="1">A boy finds the stage.</div>
        <div id="c4" class="card clip" data-start="19" data-duration="8" data-track-index="1">1914. A bowler. A cane.<br />The Tramp.</div>
        <div id="c5" class="card clip" data-start="27" data-duration="7" data-track-index="1">1919.<br />He answers to no one.</div>
        <div id="c6" class="card clip" data-start="34" data-duration="7" data-track-index="1">Hollywood learns to talk.<br />He doesn&rsquo;t.</div>
        <div id="c7" class="card clip" data-start="41" data-duration="8" data-track-index="1">1952.<br />America locks the door.</div>
        <div id="c8" class="card clip" data-start="49" data-duration="8" data-track-index="1">1972. Twelve minutes<br />of applause.</div>
      </div>
      <div id="end" class="clip" data-start="57" data-duration="3" data-track-index="2">The End.</div>
    </div>

    <script>
      // Intertitle cards: fade in shortly after each beat starts, fade out before it ends.
      const tl = gsap.timeline({ paused: true });
      const cards = [["#c1", 1.2, 5], ["#c2", 5, 12], ["#c3", 12, 19], ["#c4", 19, 27], ["#c5", 27, 34], ["#c6", 34, 41], ["#c7", 41, 49], ["#c8", 49, 57]];
      for (const [sel, a, b] of cards) {
        tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, a + 0.6);
        tl.to(sel, { opacity: 0, duration: 0.5, ease: "power1.in" }, b - 0.9);
      }
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 57.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>

    <script type="module">
      import * as THREE from "./vendor/three.module.js";

      // ---------- helpers (deterministic: everything is a pure function of time) ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
      const seg = (t, a, b) => smooth((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(1889);

      // ---------- renderer / scene ----------
      const W = 1080, H = 1920;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.7;
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x161616, 6, 26);
      scene.background = new THREE.Color(0x161616);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 200);

      const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, ...o });
      const E = (c, i = 1) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: c, emissiveIntensity: i });
      function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
      }
      function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = scene, seg = 16) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
        m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
      }
      function textTex(text, w, h, font, fg = "#111", bg = "#ddd") {
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const g = c.getContext("2d"); g.fillStyle = bg; g.fillRect(0, 0, w, h);
        g.strokeStyle = fg; g.lineWidth = h * 0.06; g.strokeRect(h * 0.08, h * 0.08, w - h * 0.16, h - h * 0.16);
        g.fillStyle = fg; g.font = font; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, w / 2, h / 2 + h * 0.03);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
      }
      function patternTex(draw, w = 256, h = 256, rx = 1, ry = 1) {
        const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.SRGBColorSpace; return t;
      }
      const cobbleTex = patternTex((g, w, h) => {
        g.fillStyle = "#3a3a3a"; g.fillRect(0, 0, w, h); const r = rng(7);
        for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const v = 70 + r() * 40 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.beginPath(); g.ellipse(x * 32 + 16 + (y % 2) * 16, y * 32 + 16, 13, 12, 0, 0, 7); g.fill(); }
      }, 256, 256, 3, 7);
      const brickTex = patternTex((g, w, h) => {
        g.fillStyle = "#2a2a2a"; g.fillRect(0, 0, w, h); const r = rng(11);
        for (let y = 0; y < 16; y++) for (let x = 0; x < 8; x++) { const v = 85 + r() * 35 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x * 32 + (y % 2) * 16 + 1, y * 16 + 1, 30, 14); }
      }, 256, 256, 2, 2);

      // ---------- lights ----------
      const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.4); scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffffff, 1.0);
      key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
      Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 0.5, far: 60 });
      key.shadow.bias = -0.0008;
      scene.add(key); scene.add(key.target);

      // ---------- the "invisible Tramp": bowler, cane, shoes ----------
      const blackFelt = M(0x1a1a1a, { roughness: 0.6 });
      function makeHat() {
        const g = new THREE.Group();
        const crown = new THREE.Mesh(new THREE.SphereGeometry(0.115, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), blackFelt); crown.position.y = 0.07; crown.scale.y = 1.05;
        const band = new THREE.Mesh(new THREE.CylinderGeometry(0.117, 0.118, 0.075, 24), blackFelt); band.position.y = 0.035;
        const ribbon = new THREE.Mesh(new THREE.CylinderGeometry(0.119, 0.119, 0.022, 24), M(0x0a0a0a, { roughness: 0.3 })); ribbon.position.y = 0.012;
        const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.175, 0.175, 0.01, 28), blackFelt);
        const curl = new THREE.Mesh(new THREE.TorusGeometry(0.175, 0.012, 8, 32), blackFelt); curl.rotation.x = Math.PI / 2; curl.position.y = 0.006;
        for (const m of [crown, band, ribbon, brim, curl]) { m.castShadow = true; g.add(m); }
        return g;
      }
      const tramp = new THREE.Group(); scene.add(tramp);
      const hatPivot = new THREE.Group(); hatPivot.position.y = 1.72; tramp.add(hatPivot);
      const hat = makeHat(); hatPivot.add(hat);
      const canePivot = new THREE.Group(); canePivot.position.set(0.3, 0.88, 0.04); tramp.add(canePivot);
      const caneMat = M(0x2b2b2b, { roughness: 0.4 });
      cyl(0.013, 0.011, 0.86, caneMat, 0, -0.43, 0, canePivot, 10);
      const hook = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.013, 8, 16, Math.PI), caneMat); hook.position.set(0, 0.0, -0.055); hook.rotation.y = Math.PI / 2; canePivot.add(hook);
      function makeShoe() {
        const g = new THREE.Group();
        const s = box(0.13, 0.09, 0.36, M(0x151515, { roughness: 0.35 }), 0, 0.045, 0.06, g);
        const toe = new THREE.Mesh(new THREE.SphereGeometry(0.068, 14, 10), s.material); toe.scale.set(1, 0.68, 1.1); toe.position.set(0, 0.045, 0.23); toe.castShadow = true; g.add(toe);
        return g;
      }
      const shoeL = makeShoe(), shoeR = makeShoe(); tramp.add(shoeL, shoeR);

      // ---------- STATION 1: London street (z 2 .. -10), night ----------
      const street = new THREE.Mesh(new THREE.PlaneGeometry(9, 16), M(0x777777, { map: cobbleTex })); street.rotation.x = -Math.PI / 2; street.position.set(0, 0, -4); street.receiveShadow = true; scene.add(street);
      const houseMats = [M(0x5a5a5a, { map: brickTex }), M(0x6a6a6a), M(0x4c4c4c, { map: brickTex })];
      const winLit = E(0xd8d0b8, 0.55), winDark = M(0x0d0d0d);
      for (const side of [-1, 1]) for (let i = 0; i < 5; i++) {
        const z = 1 - i * 2.4, h = 3.6 + R() * 1.4, x = side * 2.95;
        const house = box(2.4, h, 2.3, houseMats[(i + (side > 0 ? 1 : 0)) % 3], x, h / 2, z);
        const roof = cyl(0.01, 1.4, 1.0, M(0x2e2e2e), x, h + 0.5, z, scene, 4); roof.rotation.y = Math.PI / 4; roof.scale.z = 0.85;
        box(0.3, 0.8, 0.3, M(0x333333), x + side * 0.5, h + 0.9, z - 0.5);
        for (let f = 0; f < 2; f++) for (let k = -1; k <= 1; k += 2) box(0.02, 0.55, 0.38, R() > 0.45 ? winLit : winDark, x - side * 1.205, 1.2 + f * 1.4, z + k * 0.5);
        box(0.02, 1.1, 0.5, M(0x1e1e1e), x - side * 1.205, 0.55, z + 0.05);
      }
      const lamps = [];
      for (const [x, z] of [[-1.5, 0.5], [1.5, -2.5], [-1.5, -5.5], [1.5, -8.5]]) {
        cyl(0.04, 0.06, 2.6, M(0x1c1c1c), x, 1.3, z);
        const glass = box(0.22, 0.3, 0.22, E(0xfff1d0, 1.6), x, 2.75, z);
        box(0.28, 0.05, 0.28, M(0x1c1c1c), x, 2.93, z);
        lamps.push(glass);
      }
      const lampLightA = new THREE.PointLight(0xfff0d0, 3, 11, 1.2); lampLightA.position.set(-1.4, 2.6, -5.5); scene.add(lampLightA);
      const lampLightB = new THREE.PointLight(0xfff0d0, 3, 11, 1.2); lampLightB.position.set(1.4, 2.6, -2.5); scene.add(lampLightB);

      // ---------- STATION 2/3: workhouse (front at z -11.5) that opens into a music-hall stage ----------
      const wh = new THREE.Group(); wh.position.set(0, 0, -13.5); scene.add(wh);
      const brick = M(0x5e5e5e, { map: brickTex });
      box(5, 3.6, 0.2, brick, 0, 1.8, -2, wh);               // back
      box(0.2, 3.6, 4, brick, -2.5, 1.8, 0, wh);             // left
      box(0.2, 3.6, 4, brick, 2.5, 1.8, 0, wh);              // right
      box(5.4, 0.25, 4.4, M(0x2a2a2a), 0, 3.72, 0, wh);      // roof slab
      const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.5), new THREE.MeshStandardMaterial({ map: textTex("WORKHOUSE", 1024, 200, "bold 120px FreeSerif", "#111", "#cfcfcf") }));
      sign.position.set(0, 4.15, 2.1); wh.add(sign);
      box(2.8, 0.06, 0.06, M(0x222222), 0, 3.88, 2.1, wh);
      const step = box(1.6, 0.14, 0.6, M(0x6e6e6e), 0, 0.07, 2.35, wh);
      // front wall in two hinged halves (hinges at x = ±2.5)
      const doors = [];
      for (const s of [-1, 1]) {
        const pivot = new THREE.Group(); pivot.position.set(s * 2.5, 0, 2.0); wh.add(pivot);
        box(2.5, 3.6, 0.18, brick, -s * 1.25, 1.8, 0, pivot);
        for (const fy of [1.1, 2.5]) {
          const wx = -s * 1.25;
          box(0.9, 0.7, 0.02, M(0x0c0c0c), wx, fy, 0.1, pivot);
          for (let b = -1; b <= 1; b++) box(0.035, 0.7, 0.035, M(0x2a2a2a), wx + b * 0.25, fy, 0.12, pivot);
        }
        doors.push({ pivot, s });
      }
      // stage inside
      const stageFloor = box(4.4, 0.5, 2.6, M(0x7a6e62), 0, 0.25, -0.5, wh);
      box(4.6, 0.4, 0.3, M(0x3a3a3a), 0, 3.0, 0.9, wh); // proscenium header
      const backdrop = box(4.6, 3.0, 0.1, M(0x3d3d3d), 0, 2.0, -1.8, wh);
      const curtains = [];
      for (const s of [-1, 1]) { const c = box(2.3, 2.6, 0.12, M(0x4a4a4a, { roughness: 1 }), s * 1.15, 1.8, 0.75, wh); curtains.push({ c, s }); }
      const foot = [];
      for (let i = 0; i < 9; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), E(0xfff3d6, 0)); f.position.set(-2 + i * 0.5, 0.56, 0.7); wh.add(f); foot.push(f); }
      const stageSpot = new THREE.SpotLight(0xffffff, 0, 9, 0.42, 0.5, 1.2); stageSpot.position.set(0, 3.4, 1.6); stageSpot.target.position.set(0, 0.5, -13.9); scene.add(stageSpot, stageSpot.target);
      stageSpot.position.add(wh.position);
      const hatSmall = makeHat(); scene.add(hatSmall);

      // ---------- STATION 4: 1914 racetrack (front straight at z -29.2), daylight ----------
      const field = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), M(0x8e8e8e)); field.rotation.x = -Math.PI / 2; field.position.set(0, -0.01, -33); field.receiveShadow = true; scene.add(field);
      const track = new THREE.Mesh(new THREE.RingGeometry(3.2, 5.0, 64), M(0xb3aa9c)); track.rotation.x = -Math.PI / 2; track.scale.set(2.6, 1, 1); track.position.set(0, 0.005, -33.4); track.receiveShadow = true; scene.add(track);
      const railMat = M(0xe8e8e8);
      box(26, 0.06, 0.06, railMat, 0, 0.9, -30.9); box(26, 0.06, 0.06, railMat, 0, 0.55, -30.9);
      for (let i = 0; i < 27; i++) box(0.07, 0.95, 0.07, railMat, -13 + i, 0.47, -30.9);
      const stand = new THREE.Group(); stand.position.set(0, 0, -41); scene.add(stand);
      for (let r = 0; r < 5; r++) box(16, 0.4, 1.0, M(0x9a9a9a), 0, 0.2 + r * 0.45, r * -0.9, stand);
      box(16.4, 0.15, 5.6, M(0x5a5a5a), 0, 4.2, -1.8, stand);
      for (const x of [-8, -4, 0, 4, 8]) cyl(0.08, 0.08, 4.2, M(0x6a6a6a), x, 2.1, 0.6, stand, 8);
      for (let i = 0; i < 70; i++) { const r = i % 5, x = -7.5 + (i * 0.23 + R() * 0.15) % 15; const p = cyl(0.11, 0.13, 0.42, M(0x2c2c2c + ((R() * 6) | 0) * 0x101010), x, 0.65 + r * 0.45, r * -0.9, stand, 6); p.castShadow = false; }
      for (const x of [-9, 9]) { cyl(0.04, 0.04, 6, M(0x444444), x, 3, -40, scene, 6); const fl = box(1.0, 0.55, 0.02, M(0xdddddd), x + 0.52, 5.6, -40); fl.castShadow = false; }
      // hand-cranked 1910s film camera on a tripod, facing -x
      const fcam = new THREE.Group(); fcam.position.set(2.3, 0, -28.4); fcam.rotation.y = -Math.PI / 2; scene.add(fcam);
      for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2; const leg = cyl(0.02, 0.02, 1.35, M(0x4a3f35), Math.cos(a) * 0.25, 0.64, Math.sin(a) * 0.25, fcam, 6); leg.rotation.set(Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35); }
      box(0.3, 0.32, 0.45, M(0x2b2b2b), 0, 1.45, 0, fcam);
      const lens = cyl(0.07, 0.08, 0.2, M(0x111111), 0, 1.45, 0.32, fcam, 14); lens.rotation.x = Math.PI / 2;
      for (const dz of [-0.12, 0.12]) { const reel = cyl(0.16, 0.16, 0.05, M(0x3a3a3a), 0, 1.78, dz, fcam, 20); reel.rotation.z = Math.PI / 2; }
      const crank = box(0.02, 0.16, 0.02, M(0x777777), 0.17, 1.45, -0.05, fcam);

      // ---------- STATION 5/6: studio lot + soundstage (gate z -48, room z -49.6 .. -57) ----------
      const lot = new THREE.Mesh(new THREE.PlaneGeometry(30, 22), M(0x707070)); lot.rotation.x = -Math.PI / 2; lot.position.set(0, 0, -52); lot.receiveShadow = true; scene.add(lot);
      const blocks = [];
      for (const [x, z, w, h, d] of [[-6.5, -51, 4, 4.4, 5], [6.5, -51, 4, 5.0, 5], [-6.5, -57.5, 4, 5.6, 6], [6.5, -57.5, 4, 4.8, 6], [-11, -54, 3, 3.6, 4], [11, -54, 3, 4.2, 4]]) {
        const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
        box(w, h, d, M(0xb4b4b4), 0, h / 2, 0, g);
        const vault = cyl(w / 2, w / 2, d, M(0x8a8a8a), 0, h, 0, g, 20); vault.rotation.x = Math.PI / 2; vault.scale.y = 1; vault.scale.x = 1; vault.scale.z = 0.35;
        box(1.0, 1.6, 0.04, M(0x2a2a2a), 0, 0.8, d / 2 + 0.02, g);
        blocks.push(g);
      }
      const gate = new THREE.Group(); scene.add(gate);
      const gateMat = M(0xd6d6d6);
      box(0.36, 3.4, 0.36, gateMat, -1.3, 1.7, -48, gate); box(0.36, 3.4, 0.36, gateMat, 1.3, 1.7, -48, gate);
      box(3.3, 0.5, 0.45, gateMat, 0, 3.55, -48, gate);
      const uaSign = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 0.42), new THREE.MeshStandardMaterial({ map: textTex("UNITED ARTISTS", 1400, 196, "bold 120px FreeSerif", "#111", "#eeeeee") }));
      uaSign.position.set(0, 3.55, -47.76); gate.add(uaSign);
      const leaves = [];
      for (const s of [-1, 1]) {
        const p = new THREE.Group(); p.position.set(s * 1.12, 0, -48); scene.add(p);
        for (let i = 0; i < 5; i++) box(0.04, 2.2, 0.04, M(0x2b2b2b), -s * (0.12 + i * 0.24), 1.2, 0, p);
        box(1.12, 0.06, 0.05, M(0x2b2b2b), -s * 0.56, 0.3, 0, p); box(1.12, 0.06, 0.05, M(0x2b2b2b), -s * 0.56, 2.2, 0, p);
        leaves.push({ p, s });
      }
      // soundstage interior (open front)
      const room = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 7.4), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, side: THREE.BackSide, roughness: 1 }));

        oscarSpot.intensity = sp * 380; hallFill.intensity = sp * 9; moonLight.intensity = (t >= 41 && t < 49) ? 1.4 : 0; beam.material.opacity = sp * 0.16;
        seats.forEach((s, i) => {
          const up = seg(t, 52.0 + s.row * 0.55 + s.j * 0.25, 52.7 + s.row * 0.55 + s.j * 0.25);
          const clap = up > 0.99 ? Math.abs(Math.sin(t * 9 + s.j * 6)) * 0.03 : 0;
          dummy.position.set(s.x, lerp(0.55, 0.85, up) + clap, s.z); dummy.rotation.set(0, Math.PI, 0); dummy.scale.set(1, lerp(0.85, 1.25, up), 1); dummy.updateMatrix(); bodyIM.setMatrixAt(i, dummy.matrix);
          dummy.position.y = lerp(1.0, 1.52, up) + clap; dummy.scale.setScalar(1); dummy.updateMatrix(); headIM.setMatrixAt(i, dummy.matrix);
        });
        bodyIM.instanceMatrix.needsUpdate = headIM.instanceMatrix.needsUpdate = true;

        updateTramp(t);
        renderer.render(scene, camera);
        overlays(t);
      }

      // ---------- film look + iris (DOM overlays, all derived from time) ----------
      const grain = document.getElementById("grain").getContext("2d");
      const gimg = grain.createImageData(270, 480);
      const stageEl = document.getElementById("stage"), glEl = document.getElementById("gl");
      const flick = document.getElementById("flicker"), fadeEl = document.getElementById("fade");
      function overlays(t) {
        const f = Math.floor(t * 30), r = rng(f + 77);
        for (let i = 0; i < gimg.data.length; i += 4) { const v = (r() * 255) | 0; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
        grain.putImageData(gimg, 0, 0);
        flick.style.opacity = (0.03 + hash(f) * 0.06).toFixed(3);
        glEl.style.transform = `translate(${((hash(f * 3.1) - 0.5) * 2.4).toFixed(2)}px, ${((hash(f * 7.7) - 0.5) * 2.4).toFixed(2)}px)`;
        let rad = 1400;
        if (t < 1.4) rad = smooth(t / 1.4) * 1400;
        if (t > 58.3) rad = (1 - smooth((t - 58.3) / 0.7)) * 1400;
        stageEl.style.clipPath = rad >= 1400 ? "none" : `circle(${rad.toFixed(1)}px at 50% 47%)`;
        const whip = Math.max(0, 1 - Math.abs(t - 41) / 0.25), fog = Math.max(0, 1 - Math.abs(t - 49) / 0.6);
        fadeEl.style.background = whip > fog ? "#e8e8e8" : "#6a6a6a";
        fadeEl.style.opacity = Math.max(whip, fog).toFixed(3);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
